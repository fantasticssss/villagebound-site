<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Villagebound — панель разработчика</title>
  <style>
    :root{--bg:#111411;--panel:#181c18;--ink:#f0ece2;--body:#c2c1b8;--muted:#838980;--line:#323832;--gold:#d4aa64;--red:#c76d61}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,sans-serif}.wrap{width:min(1100px,92%);margin:0 auto;padding:42px 0 80px}h1,h2,h3{font-family:"Arial Black",Arial,sans-serif}h1{font-size:clamp(28px,5vw,48px);margin:0}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.back{color:var(--gold);text-decoration:none}.card{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:20px;margin:14px 0}.login{max-width:480px;margin:12vh auto}.field{display:grid;gap:6px;margin:14px 0}.field label{font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;background:#0f120f;color:var(--ink);padding:10px 11px;font:inherit}.field textarea{min-height:105px;resize:vertical}.btn{border:1px solid var(--line);border-radius:8px;background:#1b201b;color:var(--ink);padding:9px 13px;cursor:pointer;font-weight:700}.btn:hover{border-color:var(--gold)}.btn.primary{background:var(--gold);border-color:var(--gold);color:#141714}.btn.danger{color:#efb0a8;border-color:#67423e}.btn.small{padding:6px 9px;font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tab.active{background:var(--gold);border-color:var(--gold);color:#151714}.pane{display:none}.pane.active{display:block}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.meta{color:var(--muted);font-size:13px}.status{min-height:24px;color:#cbd7bd;margin-top:9px}.badge{display:inline-block;padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.empty{color:var(--muted);padding:24px 0}.poll-options{margin:8px 0;color:var(--body)}[hidden]{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.card{padding:15px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section id="loginView" class="login card">
      <a class="back" href="index.html">← Вернуться на сайт</a>
      <h1>Вход разработчика</h1>
      <p class="meta">Доступ разрешён только владельцу Villagebound.</p>
      <form id="loginForm">
        <div class="field"><label>Почта</label><input id="email" type="email" value="ttjtioc.ha.muhyc@gmail.com" readonly></div>
        <div class="field"><label for="password">Пароль</label><input id="password" type="password" required autocomplete="current-password"></div>
        <button class="btn primary" type="submit">Войти</button>
        <div class="status" id="loginStatus"></div>
      </form>
    </section>

    <section id="adminView" hidden>
      <div class="top"><div><a class="back" href="index.html">← Открыть сайт</a><h1>Панель разработчика</h1></div><button class="btn" id="logoutBtn">Выйти</button></div>
      <div class="tabs"><button class="btn tab active" data-tab="ideas">Предложения</button><button class="btn tab" data-tab="questions">Вопросы</button><button class="btn tab" data-tab="polls">Опросы</button></div>

      <section class="pane active" id="ideasPane"><div class="toolbar"><h2>Предложения</h2><button class="btn" data-refresh="ideas">Обновить</button></div><div id="ideasList"></div></section>
      <section class="pane" id="questionsPane"><div class="toolbar"><h2>Вопросы</h2><button class="btn" data-refresh="questions">Обновить</button></div><div id="questionsList"></div></section>
      <section class="pane" id="pollsPane">
        <div class="toolbar"><h2>Опросы</h2><button class="btn" data-refresh="polls">Обновить</button></div>
        <form class="card" id="pollForm">
          <h3>Создать опрос</h3>
          <div class="field"><label for="pollTitle">Заголовок</label><input id="pollTitle" required maxlength="180"></div>
          <div class="field"><label for="pollBody">Описание</label><textarea id="pollBody" maxlength="3000"></textarea></div>
          <div class="field"><label for="pollImage">Изображение — необязательно</label><input id="pollImage" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></div>
          <div class="field"><label for="pollOptions">Варианты ответа — каждый с новой строки</label><textarea id="pollOptions" required placeholder="Первый вариант&#10;Второй вариант"></textarea></div>
          <button class="btn primary" type="submit">Создать и опубликовать</button><div class="status" id="pollStatus"></div>
        </form>
        <div id="pollsList"></div>
      </section>
    </section>
  </main>
  <script src="admin-native.js"></script>
  <script type="text/plain">
    const URL='https://gqaydqnzhoqihbzimify.supabase.co',KEY='sb_publishable_QyWjseNpmoQOsqcFAq5_7w_3t4_b8GK',ADMIN='ttjtioc.ha.muhyc@gmail.com';
    const db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}}),loginView=document.getElementById('loginView'),adminView=document.getElementById('adminView');
    const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML},date=v=>new Date(v).toLocaleString('ru-RU');
    async function enter(session){const email=session?.user?.email?.toLowerCase();if(email!==ADMIN){if(session)await db.auth.signOut();loginView.hidden=false;adminView.hidden=true;return}loginView.hidden=true;adminView.hidden=false;await Promise.all([loadIdeas(),loadQuestions(),loadPolls()])}
    document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const s=document.getElementById('loginStatus');s.textContent='Входим…';const {data,error}=await db.auth.signInWithPassword({email:ADMIN,password:document.getElementById('password').value});if(error){s.textContent='Ошибка входа: '+error.message;return}s.textContent='';enter(data.session)});
    document.getElementById('logoutBtn').addEventListener('click',async()=>{await db.auth.signOut();location.reload()});
    document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab+'Pane'))}));
    document.querySelectorAll('[data-refresh]').forEach(b=>b.addEventListener('click',()=>({ideas:loadIdeas,questions:loadQuestions,polls:loadPolls})[b.dataset.refresh]()));

    async function loadIdeas(){const box=document.getElementById('ideasList');box.innerHTML='<div class="empty">Загрузка…</div>';const {data,error}=await db.from('ideas').select('*').order('created_at',{ascending:false});if(error){box.textContent=error.message;return}box.innerHTML=data.length?data.map(i=>`<article class="card" data-idea="${i.id}"><div class="meta">${date(i.created_at)} · <span class="badge">${esc(i.status)}</span> · ${esc(i.visibility)}</div><div class="grid"><div class="field"><label>Никнейм</label><input data-field="nickname" value="${esc(i.nickname)}"></div><div class="field"><label>Категория</label><input data-field="category" value="${esc(i.category)}"></div></div><div class="field"><label>Предложение</label><textarea data-field="body">${esc(i.body)}</textarea></div><div class="field"><label>Ответ разработчика</label><textarea data-field="developer_reply">${esc(i.developer_reply||'')}</textarea></div><div class="actions"><button class="btn small" data-action="save-idea">Сохранить</button><button class="btn small primary" data-action="publish-idea">Опубликовать</button><button class="btn small" data-action="reject-idea">Отклонить</button><button class="btn small danger" data-action="delete-idea">Удалить</button></div><div class="status"></div></article>`).join(''):'<div class="empty">Предложений пока нет.</div>'}
    document.getElementById('ideasList').addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const c=b.closest('[data-idea]'),id=c.dataset.idea,status=c.querySelector('.status'),action=b.dataset.action;if(action==='delete-idea'&&!confirm('Удалить предложение?'))return;let result;if(action==='delete-idea')result=await db.from('ideas').delete().eq('id',id);else{const patch={nickname:c.querySelector('[data-field=nickname]').value.trim(),category:c.querySelector('[data-field=category]').value.trim(),body:c.querySelector('[data-field=body]').value.trim(),developer_reply:c.querySelector('[data-field=developer_reply]').value.trim()||null,updated_at:new Date().toISOString()};if(action==='publish-idea')patch.status='published';if(action==='reject-idea')patch.status='rejected';result=await db.from('ideas').update(patch).eq('id',id)}status.textContent=result.error?result.error.message:'Готово';if(!result.error&&action!=='save-idea')loadIdeas()});

    async function loadQuestions(){const box=document.getElementById('questionsList');box.innerHTML='<div class="empty">Загрузка…</div>';const {data,error}=await db.from('questions').select('*').order('created_at',{ascending:false});if(error){box.textContent=error.message;return}box.innerHTML=data.length?data.map(q=>`<article class="card" data-question="${q.id}"><div class="meta">${date(q.created_at)} · <span class="badge">${esc(q.status)}</span></div><div class="field"><label>Никнейм</label><input data-field="nickname" value="${esc(q.nickname)}"></div><div class="field"><label>Вопрос</label><textarea data-field="question">${esc(q.question)}</textarea></div><div class="field"><label>Ответ</label><textarea data-field="answer">${esc(q.answer||'')}</textarea></div><div class="actions"><button class="btn small" data-action="save-question">Сохранить</button><button class="btn small primary" data-action="publish-question">Опубликовать ответ</button><button class="btn small" data-action="reject-question">Отклонить</button><button class="btn small danger" data-action="delete-question">Удалить</button></div><div class="status"></div></article>`).join(''):'<div class="empty">Вопросов пока нет.</div>'}
    document.getElementById('questionsList').addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const c=b.closest('[data-question]'),id=c.dataset.question,status=c.querySelector('.status'),action=b.dataset.action;if(action==='delete-question'&&!confirm('Удалить вопрос?'))return;let result;if(action==='delete-question')result=await db.from('questions').delete().eq('id',id);else{const patch={nickname:c.querySelector('[data-field=nickname]').value.trim(),question:c.querySelector('[data-field=question]').value.trim(),answer:c.querySelector('[data-field=answer]').value.trim()||null};if(action==='publish-question'){if(!patch.answer){status.textContent='Сначала напишите ответ.';return}patch.status='published';patch.answered_at=new Date().toISOString()}if(action==='reject-question')patch.status='rejected';result=await db.from('questions').update(patch).eq('id',id)}status.textContent=result.error?result.error.message:'Готово';if(!result.error&&action!=='save-question')loadQuestions()});

    document.getElementById('pollForm').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('pollStatus'),labels=document.getElementById('pollOptions').value.split('\n').map(x=>x.trim()).filter(Boolean);if(labels.length<2){status.textContent='Нужно минимум два варианта.';return}status.textContent='Создаём…';let imageUrl=null,file=document.getElementById('pollImage').files[0];if(file){const path=crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),upload=await db.storage.from('poll-images').upload(path,file);if(upload.error){status.textContent=upload.error.message;return}imageUrl=db.storage.from('poll-images').getPublicUrl(path).data.publicUrl}const created=await db.from('polls').insert({title:document.getElementById('pollTitle').value.trim(),body:document.getElementById('pollBody').value.trim()||null,image_url:imageUrl,status:'published'}).select('id').single();if(created.error){status.textContent=created.error.message;return}const options=await db.from('poll_options').insert(labels.map((label,position)=>({poll_id:created.data.id,label,position})));if(options.error){await db.from('polls').delete().eq('id',created.data.id);status.textContent=options.error.message;return}e.target.reset();status.textContent='Опрос опубликован.';loadPolls()});
    async function loadPolls(){const box=document.getElementById('pollsList');box.innerHTML='<div class="empty">Загрузка…</div>';const {data,error}=await db.from('polls').select('*,poll_options(id,label,position)').order('created_at',{ascending:false});if(error){box.textContent=error.message;return}box.innerHTML=data.length?data.map(p=>`<article class="card" data-poll="${p.id}"><div class="meta">${date(p.created_at)} · <span class="badge">${esc(p.status)}</span></div><h3>${esc(p.title)}</h3><div class="poll-options">${(p.poll_options||[]).sort((a,b)=>a.position-b.position).map(o=>'• '+esc(o.label)).join('<br>')}</div><div class="actions"><button class="btn small primary" data-poll-action="published">Опубликовать</button><button class="btn small" data-poll-action="closed">Закрыть</button><button class="btn small" data-poll-action="draft">Скрыть</button><button class="btn small danger" data-poll-action="delete">Удалить</button></div><div class="status"></div></article>`).join(''):'<div class="empty">Опросов пока нет.</div>'}
    document.getElementById('pollsList').addEventListener('click',async e=>{const b=e.target.closest('[data-poll-action]');if(!b)return;const c=b.closest('[data-poll]'),id=c.dataset.poll,action=b.dataset.pollAction;if(action==='delete'&&!confirm('Удалить опрос и все голоса?'))return;const result=action==='delete'?await db.from('polls').delete().eq('id',id):await db.from('polls').update({status:action}).eq('id',id);c.querySelector('.status').textContent=result.error?result.error.message:'Готово';if(!result.error)loadPolls()});
    db.auth.getSession().then(({data})=>enter(data.session));
  </script>
</body>
</html>
