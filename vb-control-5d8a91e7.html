<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Villagebound — панель разработчика</title>
  <style>
    :root{--bg:#111411;--panel:#181c18;--ink:#f0ece2;--body:#c2c1b8;--muted:#838980;--line:#323832;--gold:#d4aa64;--red:#c76d61}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,sans-serif}.wrap{width:min(1100px,92%);margin:0 auto;padding:42px 0 80px}h1,h2,h3{font-family:"Arial Black",Arial,sans-serif}h1{font-size:clamp(28px,5vw,48px);margin:0}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.back{color:var(--gold);text-decoration:none}.card{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:20px;margin:14px 0}.login{max-width:480px;margin:12vh auto}.field{display:grid;gap:6px;margin:14px 0}.field label{font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;background:#0f120f;color:var(--ink);padding:10px 11px;font:inherit}.field textarea{min-height:105px;resize:vertical}.btn{border:1px solid var(--line);border-radius:8px;background:#1b201b;color:var(--ink);padding:9px 13px;cursor:pointer;font-weight:700}.btn:hover{border-color:var(--gold)}.btn.primary{background:var(--gold);border-color:var(--gold);color:#141714}.btn.danger{color:#efb0a8;border-color:#67423e}.btn.small{padding:6px 9px;font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tab.active{background:var(--gold);border-color:var(--gold);color:#151714}.pane{display:none}.pane.active{display:block}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.status-filters{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 20px}.status-filter{display:inline-flex;align-items:center;gap:7px}.status-filter.active{border-color:var(--gold);color:var(--gold);background:#211f18}.filter-count{min-width:22px;padding:1px 6px;border-radius:999px;background:#0f120f;color:var(--muted);font-size:12px;text-align:center}.status-filter.active .filter-count{color:var(--gold)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.meta{color:var(--muted);font-size:13px}.status{min-height:24px;color:#cbd7bd;margin-top:9px}.badge{display:inline-block;padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.empty{color:var(--muted);padding:24px 0}.poll-options{margin:8px 0;color:var(--body)}[hidden]{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.card{padding:15px}.status-filter{flex:1 1 calc(50% - 8px);justify-content:space-between}}
  </style>
</head>
<body>
  <main class="wrap">
    <section id="loginView" class="login card">
      <a class="back" href="index.html">← Вернуться на сайт</a>
      <h1>Вход разработчика</h1>
      <p class="meta">Доступ разрешён только владельцу Villagebound.</p>
      <form id="loginForm">
        <div class="field"><label for="email">Почта</label><input id="email" type="email" required autocomplete="username" placeholder="Введите почту"></div>
        <div class="field"><label for="password">Пароль</label><input id="password" type="password" required autocomplete="current-password"></div>
        <button class="btn primary" type="submit">Войти</button>
        <div class="status" id="loginStatus"></div>
      </form>
    </section>

    <section id="adminView" hidden>
      <div class="top"><div><a class="back" href="index.html">← Открыть сайт</a><h1>Панель разработчика</h1></div><button class="btn" id="logoutBtn">Выйти</button></div>
      <div class="tabs"><button class="btn tab active" data-tab="ideas">Предложения</button><button class="btn tab" data-tab="questions">Вопросы</button><button class="btn tab" data-tab="polls">Опросы</button></div>

      <section class="pane active" id="ideasPane"><div class="toolbar"><h2>Предложения</h2><button class="btn" data-refresh="ideas">Обновить</button></div><div class="status-filters" data-filter-group="ideas"><button class="btn status-filter active" data-status="pending">Непросмотренные <span class="filter-count">0</span></button><button class="btn status-filter" data-status="published">Опубликованные <span class="filter-count">0</span></button><button class="btn status-filter" data-status="rejected">Отклонённые <span class="filter-count">0</span></button><button class="btn status-filter" data-status="all">Все <span class="filter-count">0</span></button></div><div id="ideasList"></div></section>
      <section class="pane" id="questionsPane"><div class="toolbar"><h2>Вопросы</h2><button class="btn" data-refresh="questions">Обновить</button></div><div class="status-filters" data-filter-group="questions"><button class="btn status-filter active" data-status="pending">Непросмотренные <span class="filter-count">0</span></button><button class="btn status-filter" data-status="published">Опубликованные <span class="filter-count">0</span></button><button class="btn status-filter" data-status="rejected">Отклонённые <span class="filter-count">0</span></button><button class="btn status-filter" data-status="all">Все <span class="filter-count">0</span></button></div><div id="questionsList"></div></section>
      <section class="pane" id="pollsPane">
        <div class="toolbar"><h2>Опросы</h2><button class="btn" data-refresh="polls">Обновить</button></div>
        <form class="card" id="pollForm">
          <h3>Создать опрос</h3>
          <div class="field"><label for="pollTitle">Заголовок</label><input id="pollTitle" required maxlength="180"></div>
          <div class="field"><label for="pollBody">Описание</label><textarea id="pollBody" maxlength="3000"></textarea></div>
          <div class="field"><label for="pollImage">Изображение — необязательно</label><input id="pollImage" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></div>
          <div class="field"><label for="pollOptions">Варианты ответа — каждый с новой строки</label><textarea id="pollOptions" required placeholder="Первый вариант&#10;Второй вариант"></textarea></div>
          <button class="btn primary" type="submit">Создать и опубликовать</button><div class="status" id="pollStatus"></div>
        </form>
        <div id="pollsList"></div>
      </section>
    </section>
  </main>
  <script src="admin-native.js"></script>
</body>
</html>
